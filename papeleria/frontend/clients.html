<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes - Papelería</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">Papelería</div>
    <nav id="nav" aria-label="Principal"></nav>
    <div id="user-box" class="user-box"></div>
  </aside>
  <main>
    <h1>Clientes</h1>
    <div id="message" class="message" role="status"></div>
    <section class="panel" id="form-panel">
      <h2 id="form-title">Registrar cliente</h2>
      <form id="client-form" class="grid-form">
        <input type="hidden" id="client-id">
        <label>Cédula (10 dígitos) <input id="cedula" required pattern="\d{10}" maxlength="10" inputmode="numeric"></label>
        <label>Nombre <input id="name" required maxlength="120"></label>
        <label>Teléfono <input id="phone" type="tel" maxlength="16"></label>
        <label>Correo <input id="email" type="email" maxlength="120"></label>
        <div class="actions">
          <button type="submit">Guardar cliente</button>
          <button type="button" class="secondary" id="cancel-btn" hidden>Cancelar edición</button>
        </div>
      </form>
    </section>
    <section class="panel">
      <h2>Clientes registrados</h2>
      <form id="search-form" class="inline-form">
        <label>Cédula o nombre <input id="search-q"></label>
        <button type="submit">Buscar</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Cédula</th><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Acciones</th></tr></thead>
          <tbody id="clients-body"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
<script src="js/clients.js"></script>
</body>
</html>
