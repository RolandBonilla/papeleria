<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos - Papelería</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">Papelería</div>
    <nav id="nav" aria-label="Principal"></nav>
    <div id="user-box" class="user-box"></div>
  </aside>
  <main>
    <h1>Productos</h1>
    <div id="message" class="message" role="status"></div>
    <section class="panel" id="form-panel">
      <h2 id="form-title">Registrar producto</h2>
      <form id="product-form" class="grid-form">
        <input type="hidden" id="product-id">
        <label>Código <input id="code" required maxlength="30"></label>
        <label>Nombre <input id="name" required maxlength="120"></label>
        <label>Categoría <select id="category" required></select></label>
        <label>Precio ($) <input id="price" type="number" min="0.01" step="0.01" required></label>
        <label>Stock inicial <input id="stock" type="number" min="0" step="1" value="0" required></label>
        <label>Stock mínimo <input id="min_stock" type="number" min="0" step="1" value="0" required></label>
        <div class="actions">
          <button type="submit">Guardar producto</button>
          <button type="button" class="secondary" id="cancel-btn" hidden>Cancelar edición</button>
        </div>
      </form>
      <form id="category-form" class="inline-form" style="margin-top:1rem">
        <label>Nueva categoría <input id="category-name" required maxlength="60"></label>
        <button type="submit" class="secondary">Agregar categoría</button>
      </form>
    </section>
    <section class="panel">
      <h2>Lista de productos</h2>
      <form id="search-form" class="inline-form">
        <label>Código o nombre <input id="search-q"></label>
        <label>Categoría <select id="search-category"></select></label>
        <button type="submit">Buscar</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Código</th><th>Nombre</th><th>Categoría</th><th class="num">Precio</th><th class="num">Stock</th><th class="num">Mínimo</th><th>Acciones</th></tr></thead>
          <tbody id="products-body"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
<script src="js/products.js"></script>
</body>
</html>
