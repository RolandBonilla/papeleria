<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Papelería</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Papelería</h1>
    <p style="color:var(--muted);margin-top:0">Control de inventario y ventas</p>
    <div id="message" class="message" role="status"></div>
    <form id="login-form">
      <label>Usuario <input id="username" required autocomplete="username" autofocus></label>
      <label>Contraseña <input id="password" type="password" required autocomplete="current-password"></label>
      <button type="submit">Iniciar sesión</button>
    </form>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
