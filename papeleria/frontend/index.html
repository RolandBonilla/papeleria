<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resumen del día - Papelería</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">Papelería</div>
    <nav id="nav" aria-label="Principal"></nav>
    <div id="user-box" class="user-box"></div>
  </aside>
  <main>
    <h1>Resumen del día</h1>
    <div id="message" class="message" role="status"></div>
    <div class="stats">
      <div class="stat"><strong id="stat-products">-</strong><span>Productos registrados</span></div>
      <div class="stat alert"><strong id="stat-low">-</strong><span>Productos con stock bajo</span></div>
      <div class="stat"><strong id="stat-sales">-</strong><span>Ventas de hoy</span></div>
      <div class="stat"><strong id="stat-total">-</strong><span>Total vendido hoy</span></div>
    </div>
    <section class="panel">
      <h2>Alertas de stock</h2>
      <ul id="alerts" class="alert-list"></ul>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
